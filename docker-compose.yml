services:
  web:
    build: .
    container_name: clinic_backend

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: clinic_redis

    restart: unless-stopped

    ports:
      - "6379:6379"